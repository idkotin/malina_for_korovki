device:
  id: "ISRK_Hozain_rasp"

send:
  url: "http://127.0.0.1:8000/telemetry"
  interval_s: 0.5
  timeout_s: 3.0
  max_batch: 50

events:
  url: "http://127.0.0.1:8000/modem-events"
  timeout_s: 5.0
  max_batch: 50

buffer:
  sqlite_path: "./data/buffer.sqlite3"
  max_rows: 200000
  max_rows_events: 50000

gps:
  enabled: true
  # Fixed GPS port. Keep null to auto-detect from port_candidates.
  port: null
  # Add all possible modem ttyUSB ports here.
  port_candidates: ["/dev/ttyUSB1", "/dev/ttyUSB3", "/dev/ttyUSB0", "/dev/ttyUSB2"]
  # For SIM7600 GPS this is often 115200.
  baud: 115200
  baud_candidates: [9600, 19200, 38400, 57600, 115200]

weight:
  enabled: false
  # Set true when ADC + combiner are connected.
  driver: "ads1263"
  calibration_path: "./data/scale_calibration.json"
  # Keep true for tests without real load cells.
  simulate: false
  # Path where ADS1263.py from Waveshare repository is located.
  waveshare_path: "/opt/High-Pricision_AD_HAT/python"
  # Bridge reference differential inputs (E+ - E-) -> IN0-IN1
  ref_pos: 0
  ref_neg: 1
  # Bridge measurement differential inputs (SIG+ - SIG-) -> IN2-IN3
  channel_pos: 2
  channel_neg: 3
  sample_count: 10
  adc_rate: "ADS1263_20SPS"
  # Ratio filtering
  trim_fraction: 0.1
  min_ref_abs: 0.000000001

wifi:
  enabled: true
  # Preferred method for AP mode: hostapd_cli
  hostapd_cli: "hostapd_cli"
  # Fallback method: parse "ip neigh" and filter by interface
  ap_interface: "wlan0"

lte:
  enabled: true
  # Preferred: ModemManager (mmcli). If not installed, we'll try AT.
  mmcli: "mmcli"
  at_ports: ["/dev/ttyUSB0", "/dev/ttyUSB2", "/dev/ttyUSB3"]
  at_baud: 115200
  events_enabled: true
  # Fixed AT port for SMS/call events. If null, we auto-detect from at_ports.
  events_port: null

logging:
  dir: "./logs"
  file: "host_monitor.log"
  level: "INFO"
  max_bytes: 5000000
  backup_count: 3

