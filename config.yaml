device:
  id: "Hozain_01"

send:
  url: "https://vi-korm.ru/api/telemetry/host"
  interval_s: 2.0
  timeout_s: 2.0
  max_batch: 20
  idle_sleep_enabled: false
  idle_after_s: 1800.0
  idle_interval_s: 120.0
  movement_confirm_s: 5.0
  movement_speed_kmh: 2.0

events:
  url: "http://127.0.0.1:8000/modem-events"
  timeout_s: 5.0
  max_batch: 50

buffer:
  sqlite_path: "./data/buffer.sqlite3"
  max_rows: 200000
  max_rows_events: 50000

gps:
  enabled: true
  # Fixed GPS port. Keep null to auto-detect from port_candidates.
  port: null
  # Add all possible modem ttyUSB ports here.
  port_candidates: ["/dev/ttyUSB1", "/dev/ttyUSB3", "/dev/ttyUSB0", "/dev/ttyUSB2"]
  # For SIM7600 GPS this is often 115200.
  baud: 115200
  baud_candidates: [9600, 19200, 38400, 57600, 115200]
  # Stop reporting an old position as valid after serial/GNSS stalls.
  max_fix_age_s: 3.0

weight:
  enabled: false
  # Set true when ADC + combiner are connected.
  driver: "ads1263"
  calibration_path: "./data/scale_calibration.json"
  # Keep true for tests without real load cells.
  simulate: false
  # Path where ADS1263.py from Waveshare repository is located.
  waveshare_path: "/opt/High-Pricision_AD_HAT/python"
  # Recommended passive parallel mode:
  # SIG+ -> IN0, SIG- -> IN1, terminal E- -> AVSS/GND, AVDD not connected.
  frontend: "adc2"
  reference_mode: "internal"
  # Legacy adc1 reference pair (kept for compatibility with old setups)
  ref_pos: 0
  ref_neg: 1
  # Passive tap measurement pair
  channel_pos: 0
  channel_neg: 1
  sample_count: 80
  adc_rate: "ADS1263_20SPS"
  adc2_rate: "ADS1263_ADC2_100SPS"
  # Ratio filtering
  trim_fraction: 0.2
  smoothing_alpha: 0.12
  fast_smoothing_alpha: 0.45
  fast_change_threshold_kg: 30.0
  zero_deadband_kg: 10.0
  median_window: 5
  min_ref_abs: 0.000000001
  invalid_below_kg: -1000.0
  invalid_above_kg: null

wifi:
  enabled: true
  # Preferred method for AP mode: hostapd_cli
  hostapd_cli: "hostapd_cli"
  # Fallback method: parse "ip neigh" and filter by interface
  ap_interface: "wlan0"
  # Poll in the background so Wi-Fi commands never delay telemetry.
  scan_interval_s: 1.0
  # Never report an old non-empty client list after polling stalls.
  max_snapshot_age_s: 2.0

lte:
  enabled: true
  # Preferred: ModemManager (mmcli). If not installed, we'll try AT.
  mmcli: "mmcli"
  at_ports: ["/dev/ttyUSB0", "/dev/ttyUSB2", "/dev/ttyUSB3"]
  at_baud: 115200
  events_enabled: true
  # Fixed AT port for SMS/call events. If null, we auto-detect from at_ports.
  events_port: null
  # Field workaround for the confirmed SIM7600 UIM lockup. It reacts only to
  # a sustained `AT+CPIN? -> SIM failure`, then issues AT+CFUN=1,1 through the
  # existing AT-port owner. Keep disabled until intentionally enabled on Pi.
  sim_failure_recovery_enabled: false
  sim_failure_poll_interval_s: 30
  sim_failure_confirm_s: 90
  sim_failure_reset_cooldown_s: 1800
  sim_failure_reset_window_s: 21600
  sim_failure_max_resets: 3
  sim_failure_reset_settle_s: 20

# Manual reboot is intentionally disabled in the public repository config.
# Put the authorized phone number only into the live config on the Raspberry Pi.
sms_reboot:
  enabled: false
  allowed_number: null
  command: "/reboot"

# Automatic recovery is disabled in the public config. Production may enable
# it only with the physical terminal-off guard based on the unfiltered weight.
auto_reboot:
  enabled: false
  telemetry_inactive_s: 900.0
  terminal_off_below_raw_kg: -1000.0
  terminal_off_confirm_s: 30.0
  max_weight_age_s: 10.0
  healthy_success_max_age_s: 10.0
  healthy_reset_confirm_s: 60.0
  state_path: "./data/auto_reboot_state.json"

logging:
  dir: "./logs"
  file: "host_monitor.log"
  level: "INFO"
  max_bytes: 5000000
  backup_count: 3

